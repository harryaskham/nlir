  data-parse-roundtrip: { mode: det, expr: "$json%($parse%($json%{k=[1,true]}))", expected: '{"k":[1,true]}' }
  data-typed-literals: { mode: det, expr: "$json%[1, 2.5, -3, true, 007, 1.50, x]", expected: '[1,2.5,-3,true,"007","1.50","x"]' }
  draw-explicit-seeds:    { mode: det, expr: "_sep=\",\";_seed=10;$draw%({$0*2}, 3)", expected: "0,2,4" }
  call-then-access:       { mode: det, expr: "$get%({a={t=ok}}, a).t", expected: "ok" }
  outer-arg-closure:      { mode: det, expr: "_sep=\",\";{$filter%({$gt%($0,$$0)}, [1,5,9])}%4", expected: "5,9" }
  outer-arg-two-levels:   { mode: det, expr: "_sep=\",\";{{{$0 ++ $$0 ++ $$$0}↦[x]}%(B)}%(A)", expected: "xBA" }
  map-ascii:            { mode: det, expr: "{$0*$0}<$>[1,2,3]", expected: "1\n4\n9" }
  map-glyph:            { mode: det, expr: "{$0*$0}↦[1,2,3]", expected: "1\n4\n9" }
  fold-glyph:           { mode: det, expr: "{$0+$1}⊘[1,2,3,4]", expected: "10" }
  hero-ops-gate-glyph:  { mode: det, expr: "$if%({$0+$1}⊘({$contains%($0,'ERROR')}↦['ok','ERROR: oom','ok','ERROR: disk full'])>=2,'page on-call','all clear')", expected: "page on-call" }
  # dicts + polymorphic `.` accessor + semantic `..` det stub (bd-27739b).
  dict-lit:             { mode: det, expr: "{k=v}", expected: "k=v" }
  dict-access:          { mode: det, expr: "{a=1, b=2}.b", expected: "2" }
  dict-eager-val:       { mode: det, expr: "{k=1+2}.k", expected: "3" }
  list-access:          { mode: det, expr: "[a,b,c].1", expected: "b" }
  list-access-neg:      { mode: det, expr: "[a,b,c].-1", expected: "c" }
  string-access:        { mode: det, expr: "'the'.2", expected: "e" }
  semantic-access-stub: { mode: det, expr: "'the planets from the sun'..3", expected: "3 of: the planets from the sun" }
  numeric-range-asc:    { mode: det, expr: "_sep=\\ ;1..5", expected: "1 2 3 4 5" }
  numeric-range-desc:   { mode: det, expr: "_sep=\\ ;5..1", expected: "5 4 3 2 1" }
  numeric-range-single: { mode: det, expr: "3..3", expected: "3" }
  numeric-range-gauss:  { mode: det, expr: "$fold%({$0+$1},1..100)", expected: "5050" }
  numeric-range-fact:   { mode: det, expr: "{$0*$1}⊘(1..5)", expected: "120" }
  numeric-range-sumsq:  { mode: det, expr: "{$0+$1}⊘({$0*$0}<$>(1..5))", expected: "55" }
  # Composed det-math statistics (msm-3, bd-429d87 tier): the mathy-golf toolkit
  # (range + $len + $gt + fold/filter) composes into exact, model-free,
  # transport-invariant statistics — the CI-assertable tier. All verified det.
  stats-mean-1-100:       { mode: det, expr: "$fold%({$0+$1},1..100)/$len%(1..100)", expected: "50.5" }
  stats-count-above-mean: { mode: det, expr: "m=$fold%({$0+$1},1..10)/$len%(1..10);$len%($filter%({$gt%($0,$m)},1..10))", expected: "5" }
  stats-sum-if-gt5:       { mode: det, expr: "{$0+$1*($gt%($1,5))}⊘[0,3,6,9]", expected: "15" }
  # Boolean forall/exists via ∧/∨ fold over a predicate-mapped list (bd-f1ee6f
  # ∧∨ in their natural reduction role; previously untested). "are they ALL
  # under 100" (∧) / "is ANY at least 100" (∨) — one-line ∀/∃ over data, exact.
  bool-forall-true:       { mode: det, expr: "{$0∧$1}⊘($map%({$lt%($0,100)},[3,50,99]))", expected: "true" }
  bool-forall-false:      { mode: det, expr: "{$0∧$1}⊘($map%({$lt%($0,100)},[3,150,99]))", expected: "false" }
  bool-exists-true:       { mode: det, expr: "{$0∨$1}⊘($map%({$gt%($0,99)},[3,150,99]))", expected: "true" }
  bool-exists-false:      { mode: det, expr: "{$0∨$1}⊘($map%({$gt%($0,99)},[3,50,99]))", expected: "false" }
  # nlir-grades-nlir as a DET CI gate (bd-b00961 made the mutual judge det-evaluate):
  # a generator PART self-verified by the mutual judge, fully offline. The det
  # generator (concat) produces EXACTLY the target, so mutual `j` (equivalence) is
  # the right check — the exact-regression use of the judge. (An llm generation
  # self-check uses one-directional `sat={$0~>$1}` instead — see the parts library.)
  self-judge-det:      { mode: det, expr: "greet={('Hello, '++$0++'!')};j={$if%($0~>$1,$1~>$0,'false')};$j%(($greet%'Ada'),'Hello, Ada!')", expected: "true" }
  msg:
    mode: det
    context:
      _messages:
        - { role: user, content: "hi" }
        - { role: assistant, content: "in rust" }
    expr: "^-1"
    expected: "in rust"
