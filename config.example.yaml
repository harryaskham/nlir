# nlir example / default configuration.
#
# `~/.config/nlir/config.yaml` is where the whole language lives: nlir is a small
# stack machine, and the operators, their fixity/priority/arity/types, the models,
# the prompts, the coercions, and the tests are all defined here. This file is the
# starter config nlir writes to `~/.config/nlir/config.yaml` on first run; edit it
# to taste. See SPEC.md for the full contract.
#
# `llm`-mode operators call the models below. `det` mode (`--mode det`) uses only
# the deterministic realisations (`command:` / `reduce:` / `template:` / `join:`),
# so the numeric and template operators work offline with no API key. Set
# `ANTHROPIC_API_KEY` in the environment to use the `haiku` model.

defaults:
  mode: llm
  # Model size tiers: an operator names a tier (small | medium | large) and it
  # resolves through here. A single `model: sonnet` (a concrete `models` alias) is
  # also still valid — tiers are opt-in and back-compatible.
  #
  # `medium` is the ops' default = `sonnet` (the claude CLI, type: command): resilient,
  # no network-proxy dependency. In the wasm/browser playground a command-kind MODEL op
  # still routes to the LLM realiser (the browser has no shell, so the op's prompt goes
  # to the Settings BYO base-url + model-id) - the model kind only selects the NATIVE
  # transport (CLI vs HTTP), not the browser path, so browser llm-mode works too.
  model:
    small: haiku
    medium: sonnet
    large: opus
  parallelism: 8

context:
  env: NLIR_CONTEXT
  file_default: ~/.config/nlir/context.json
  messages:
    key: _messages
    role_field: role
    content_field: content
    views: # ^ / ^_ / ^* / ^/ / ^!
      default: [assistant]
      user: [user]
      all: [user, assistant, system]
      system: [system]
      tool: [tool, tool_result, function]
  defaults:
    _sep: "\n" # list & message-range → text separator
    _cache: true

types: # coercion targets (deterministic parse first, LLM fallback)
  number:
    model: sonnet
    prompt: |
      Interpret the text inside <text> as a single number. Return only the number.

      %
    schema: { type: object, properties: { result: { type: number } }, required: [result] }
  bool:
    model: sonnet
    prompt: |
      Interpret the text inside <text> as a boolean. Return exactly `true` or `false`
      in lowercase, with no other text, punctuation, capitalisation, or explanation.

      %
    schema: { type: object, properties: { result: { type: boolean } }, required: [result] }
  # string: numbers/bools/lists stringify deterministically (lists join with _sep)

sessions:
  pi:
    format: pi
    keep_roles: [user, assistant]
    drop_tool_messages: true
    role_field: role
    content_field: content

models:
  haiku:
    type: anthropic_messages
    base_url: $ANTHROPIC_BASE_URL
    api_key: $ANTHROPIC_API_KEY
    model: claude-haiku-4-5
    format: json
    result_field: result
    messages:
      - role: system
        content: |
          ${NLIR_SYSTEM_PROMPT}
          ${NLIR_STRUCTURED_PROMPT}
      - role: user
        content: |
          ${NLIR_PROMPT}
    output_config:
      format:
        type: json_schema
        schema:
          type: object
          properties: { result: { type: string } }
          required: [result]
          additionalProperties: false

  sonnet:
    type: command
    format: text
    command: claude --model claude-sonnet-5 --append-system-prompt "${NLIR_SYSTEM_PROMPT}" --print "${NLIR_PROMPT}"

  # Generation / instruction-following tier (bd-d18743): mirrors the `sonnet`
  # (medium) tier but appends the GENERATIVE system frame — operand = instruction
  # to obey — instead of the transform frame, so the => op obeys by construction.
  # Point this at whatever backend your `medium` tier uses; only the frame differs.
  generative:
    type: command
    format: text
    command: claude --model claude-sonnet-5 --append-system-prompt "${NLIR_GENERATIVE_SYSTEM_PROMPT}" --print "${NLIR_PROMPT}"

  opus:
    type: command
    format: text
    command: pi --no-extensions --no-session --model github-copilot/claude-opus-4.8 --system-prompt "${NLIR_SYSTEM_PROMPT}" --print "${NLIR_PROMPT}"

  # Direct HTTP against a LiteLLM proxy speaking the Anthropic Messages API.
  direct:
    type: anthropic_messages
    base_url: ${LITELLM_BASE_URL}/v1
    api_key: $LITELLM_MASTER_KEY
    model: claude-sonnet-5
    format: text
    messages:
      - role: system
        content: "${NLIR_SYSTEM_PROMPT}"
      - role: user
        content: "${NLIR_PROMPT}"

prompts:
  system: { env: NLIR_SYSTEM_PROMPT, text: "Perform the following text transformation task.\nRespond with the transformed text in plain language.\nDo not include <text> tags in your output." }
  structured: { env: NLIR_STRUCTURED_PROMPT, text: "Format your response as JSON containing only a \"result\" field with the transformation, no preamble." }
  unstructured: { env: NLIR_UNSTRUCTURED_PROMPT, text: "Output only the text result of your transformation with no preamble." }
  # Generative / instruction-following frame (bd-d18743). Distinct from `system`:
  # the operand is an INSTRUCTION to obey, not text to transform. This frame — not
  # the per-op prompt — is what makes the => op obey rather than describe, so it
  # stays robust on weaker models.
  generative:  { env: NLIR_GENERATIVE_SYSTEM_PROMPT, text: "Treat the text inside <text> as an INSTRUCTION and return ONLY the result of following it. No preamble, no explanation, and do not restate the instruction; never describe what you would produce — produce it. Obey any length or format constraint in the instruction exactly. Do not include <text> tags in your output." }

# The everyday vocabulary as named forms over the semantic core (v2 §C). Evaluated
# into every run before the program; a context binding of the same name wins, so
# any of these can be redefined or extended per project.
prelude: |
  gist={$0 .. 'its gist, in one short sentence'};
  subject={$0 .. 'its primary subject, as a short noun phrase'};
  formal={$0 :: 'a formal, professional register'};
  casual={$0 :: 'a casual, conversational register'};
  plain={$0 :: 'plain language a child could follow'};
  question={$0 :: 'a question with the same subject and meaning'};
  expand={$0 :: 'a fuller version with more detail and explanation'};
  shorten={$0 :: 'the fewest words that keep every fact and figure'};
  implies={=>('State, in one sentence, what follows from: ' ++ $0)}

operators: # `%` = operand under replacement; `%%` = literal %
  dual:
    op: "!"
    description: |
      The opposite: a claim negated clause-wise (so !(a&b) = neither), a concept-word's antonym. An involution — !!x ≈ x.
    arity: 1
    fixity: prefix
    template: "not %"
    model: medium
    prompt: |
      Return the opposite of the text inside <text>.
      If it is a single concept-word (adjective, noun or verb such as "hot", "happy", "increase"), reply with its one-word ANTONYM — a different word of opposite meaning (hot->cold, increase->decrease), never "not X", "un-X" or the word itself.
      Otherwise negate it clause-wise, changing nothing else.
      Reply with only the result.

      %
  # The semantic core (v2 §A). `::` recasts a text as a kind of text; `..` projects a
  # part or aspect out of one; `▷` applies a described change. The everyday
  # vocabulary — formal, gist, question, … — is built from these in `prelude:`.
  recast:
    op: "::"
    det: "{$1++': '++$0}"  # det stub: "formal: hello"
    description: |
      Recast: `x :: kind` re-expresses x as the kind of text named on the right — a register, form, genre, format or length ('formal', 'a question', 'plain language', 'one sentence', 'a haiku', 'JSON') — keeping its meaning. The everyday rewrites ($formal, $plain, $question, …) are prelude forms over this one operator.
    arity: 2
    fixity: infix
    priority: 15
    model: medium
    prompt: |
      Re-express the first <text> as the kind of text described by the second <text> (a register, form, genre, format or length), keeping its meaning and every fact it states unless the kind itself demands brevity. Return only the result.

      %
  and:
    op: "&"
    description: |
      Joins operands into one 'X and Y' statement (a plan, not boolean AND); nullary & folds the premise stack.
    arity: ">0"
    fixity: mixfix
    join: " and "
    model: medium
    prompt: |
      Combine the <text> items with an "and" connective into one text meaning "t_0 and t_1 and ...".

      %
  or:
    op: "|"
    description: |
      Joins operands into one 'X or Y' choice, kept as genuine alternatives.
    arity: ">0"
    fixity: mixfix
    join: " or "
    model: medium
    prompt: |
      Combine the <text> items with an "or" connective into one text meaning "t_0 or t_1 or ...".

      %
  # Instruction-following / generation (bd-d18743) — the THIRD operator category
  # alongside TRANSFORM (reshape text) and NUMERIC. The operand is an INSTRUCTION
  # to obey, not text to reshape, so => expresses NEW thoughts (replies, drafts,
  # answers) — and composes under &/| like any string op, restoring the
  # generative half of "programs on thoughts". Uses the `generative` model so the
  # OBEYS contract is carried by the system frame, not this per-op prompt.
  respond:
    op: "=>"  # sigil greenlit by Harry (bd-d18743)
    template: "response: %"  # det-stub (det mode); generative model+frame realise llm mode
    description: |
      Instruction-following / generation: treats <text> as an INSTRUCTION and returns only the result of obeying it (vs the transform ops, which reshape their operand). Expresses NEW text — replies, drafts, answers — and composes under &/| like any string op. Bare => on a pipe obeys the piped text as the instruction.
    arity: 1
    fixity: prefix
    model: medium
    # The OBEY frame travels with the operator (not a dedicated model alias), so
    # => keeps it on whatever tier `model:` / `--model` selects.
    system: generative
    prompt: |
      %
  change:
    op: "Δ"
    template: "change: %0 -> %1"  # det stub
    description: |
      Change: how the first text becomes the second — what was added, removed or shifted. Directional (aΔb ≠ bΔa). Its partner is ▷: a ▷ (a Δ b) ≈ b.
    arity: 2
    fixity: infix
    model: medium
    prompt: |
      Describe what changed from the first <text> to the second <text>: what was added, removed, or shifted. This is directional (first → second), not a symmetric comparison. Return only the description.

      %
  apply:
    op: "▷"
    template: "%0 (changed: %1)"  # det stub
    description: |
      Apply: `x ▷ change` returns x changed as the right operand describes, and nothing else — the partner of Δ, so a ▷ (a Δ b) ≈ b. Turns edits, feedback and diffs into new text.
    arity: 2
    fixity: infix
    model: medium
    prompt: |
      Apply the change described by the second <text> to the first <text>. Change only what the description requires and keep everything else exactly as written. Return only the changed text.

      %
  entails:
    op: "~>"
    det: "{$contains%($0,$1)}"  # det mode: does the first contain the second
    description: |
      Entails: does the first text imply the second? A Bool — the preorder on meanings.
    arity: 2
    fixity: infix
    result: bool
    model: medium
    prompt: |
      Return 'true' if the content of the first <text> implies the content of the second <text>, otherwise return 'false'.

      %
  # Semantic similarity (data-trees slice): how closely the SECOND text
  # reproduces the meaning of the FIRST, as a Number in [0,1]. det mode = word-set
  # Jaccard (a real, offline lexical score); llm mode = a calibrated judgement of
  # meaning (same claims/conditions/criteria, none contradicted). The scorer for
  # "does generated text match the reference" loops: `$gen ≈ $gold >= 0.8`.
  similarity:
    op: "≈"
    det: "{$len%($inter%($matches%($lower%$0,'\\w+'),$matches%($lower%$1,'\\w+'))) / $len%($union%($matches%($lower%$0,'\\w+'),$matches%($lower%$1,'\\w+')))}"
    description: |
      Semantic similarity in [0,1]: how closely the second text reproduces the MEANING of the first (reference) text. det = word-set Jaccard; llm = judged equivalence of claims, conditions and criteria. Non-commutative in llm mode (reference first).
    arity: 2
    fixity: infix
    priority: 5
    result: number
    model: medium
    prompt: |
      The first <text> is a REFERENCE; the second <text> is a CANDIDATE. Rate how fully the candidate reproduces the reference's MEANING on a scale from 0 to 1:
      1.0 = every claim, condition, exclusion and criterion in the reference is present and nothing contradicts it (wording, order and formatting may differ);
      0.7 = the main substance matches but some specific conditions or qualifications are missing or softened;
      0.4 = partially overlapping, with important criteria missing or changed;
      0.0 = unrelated or contradictory.
      Penalise contradictions more than omissions; ignore extra harmless detail. Return only the number with two decimals.

      %
  compose:
    op: "∘"
    description: |
      Composition: (f ∘ g) % x = f % (g % x). Variadic and right-to-left — f ∘ g ∘ h applies h first. Builds pipelines from named forms: ($gist ∘ $formal) % notes. Parenthesise before applying.
    arity: ">0"
    fixity: mixfix
    priority: 17
    builtin: compose
  mtimes:
    op: "_"
    description: |
      Monoid power: `x _ n` is n copies of x appended — text repeats ('ab'_3 → 'ababab'), a list repeats its items, and a {form} composes with itself n times ({$0+1}_3 % 5 → 8).
    arity: 2
    fixity: infix
    priority: 17
    builtin: mtimes
  add:
    op: "+"
    description: |
      Sum of the numeric operands (variadic; words/units/bases coerce to numbers first).
    arity: ">0"
    fixity: mixfix
    priority: 11
    operands: number
    result: number
    reduce: add
  mul:
    op: "*"
    description: |
      Product of the numeric operands (variadic).
    arity: ">0"
    fixity: mixfix
    priority: 12
    operands: number
    result: number
    reduce: mul
  sub:
    op: "-"
    description: |
      Difference, a minus b (binary, left-associative).
    arity: 2
    fixity: infix
    priority: 11
    operands: number
    result: number
    reduce: sub
  div:
    op: "/"
    description: |
      Quotient, a divided by b (binary; guards divide-by-zero).
    arity: 2
    fixity: infix
    priority: 12
    operands: number
    result: number
    reduce: div
  pow:
    op: "**"
    description: |
      a to the power b — RIGHT-associative, so 2**3**2 = 2**(3**2) = 512 (matches math/Python).
    arity: 2
    fixity: infix
    priority: 13
    assoc: right
    operands: number
    result: number
    reduce: pow
  concat:
    op: "++"
    description: |
      Append (the Monoid op): text concatenates ("foo"++"bar" → "foobar"), lists concatenate, dicts merge with the right side winning. Variadic.
    arity: ">0"
    fixity: mixfix
    priority: 10
    operands: any
    reduce: concat
  split:
    op: "//"
    description: |
      Split a string by a separator into a list (binary): "a,b,c"//"," -> [a, b, c].
      An empty separator splits into characters.
    arity: 2
    fixity: infix
    priority: 13
    operands: string
    result: list
    reduce: split
  equals:
    op: "=="
    description: |
      True when the two operands are equal (compares their rendered value): 5 == 5 -> true, 3 == 4 -> false.
    arity: 2
    fixity: infix
    priority: 5
    operands: string
    result: bool
    reduce: eq
  not-equals:
    op: "!="
    description: |
      True when the two operands are not equal (compares their rendered value): 3 != 4 -> true.
    arity: 2
    fixity: infix
    priority: 5
    operands: string
    result: bool
    reduce: ne
  at-most:
    op: "<="
    description: |
      True when the first operand is at most the second (numeric): 3 <= 5 -> true.
    arity: 2
    fixity: infix
    priority: 5
    operands: number
    result: bool
    reduce: le
  at-least:
    op: ">="
    description: |
      True when the first operand is at least the second (numeric): 5 >= 3 -> true.
    arity: 2
    fixity: infix
    priority: 5
    operands: number
    result: bool
    reduce: ge

  less:
    op: "<"
    description: |
      True when the first operand is less than the second (numeric): 3 < 5 -> true.
    arity: 2
    fixity: infix
    priority: 5
    operands: number
    result: bool
    reduce: lt
  greater:
    op: ">"
    description: |
      True when the first operand is greater than the second (numeric): 5 > 3 -> true.
    arity: 2
    fixity: infix
    priority: 5
    operands: number
    result: bool
    reduce: gt
  length:
    op: "#"
    description: |
      Length (Foldable): the item count of a list, the key count of a dict, the character count of text. Glyph alias for $len.
    arity: 1
    fixity: prefix
    priority: 14
    builtin: len
  # Glyph operators (bd-44c294): bind ANY sigil (a word, or a multibyte glyph —
  # no ASCII-scarcity cost, like Δ) to a FORM or a BUILTIN, as an alt to
  # command:/prompt:. Uncomment to try; the user owns their config's sigil space.
  #
  # form:  the operator applies a form to its operands ($0, $1, …):
  #   square:   { op: "□", arity: 1, fixity: prefix, form: "{$0*$0}" }    # □5 → 25
  #   steelman: { op: "⇑", arity: 1, fixity: prefix, form: "{~(>@$0)}" }  # ⇑x = summarise(expand(formalise(x)))
  # builtin: bind a configured symbol to the map/fold engine. `<$>` is map's
  # keyboard-typable default; ↦ remains its visual alias, and ⊘ aliases fold.
  # All three are ordinary configured operators — the engine only sees builtin:.
  mapascii:
    op: "<$>"
    description: |
      Map: apply the left form to each item of the right list — {$0*$0}<$>[1,2,3] → [1,4,9]. Keyboard-typable alias for $map%; ↦ is the visual twin.
    arity: 2
    fixity: infix
    priority: 8
    builtin: map
  mapop:
    op: "↦"
    description: |
      Map: apply the left form to each item of the right list — {$0*$0}↦[1,2,3] → [1,4,9]. Visual alias for $map%; `<$>` is the keyboard-typable twin.
    arity: 2
    fixity: infix
    priority: 8
    builtin: map
  foldop:
    op: "⊘"
    description: |
      Fold: reduce the right list with the left binary form — {$0+$1}⊘[1,2,3,4] → 10. Glyph alias for $fold%.
    arity: 2
    fixity: infix
    priority: 8
    builtin: fold
  # Polymorphic `.` accessor (bd-27739b): one dot for list/dict/string.
  access:
    op: "."
    description: |
      Polymorphic accessor: `container.key` — `[a,b,c].1` (0-based list index, negative from end), `{k=v}.k` (dict field), `"the".2` (char at index). Out-of-range / missing key = loud error, never silent. Deterministic; `..` is the LLM/semantic twin.
    arity: 2
    fixity: infix
    # 19: above `%` application (18) so `$lib.f%x` = `($lib.f)%x` and
    # `$f%$x.k` = `$f%($x.k)` — field access binds like a member lookup.
    priority: 19
    operands: string
    result: string
    builtin: access
  # Semantic access `..` (bd-27739b) — the LLM twin of the deterministic `.` (config: @aur-2's lane).
  project:
    op: ".."
    det: "{$1++' of: '++$0}"  # det stub; two integers give the deterministic range a..b
    description: |
      Project: `x .. aspect` returns the part of x that the right operand describes — an aspect ('its subject', 'the gist in one sentence', 'the risks') or a position ('3', 'the last item', 'the largest'). The semantic twin of `.`; two integers give the range a..b instead. The prelude's $gist and $subject are projections.
    arity: 2
    fixity: infix
    priority: 16
    model: medium
    prompt: |
      Return only the part of the first <text> that the second <text> describes — an aspect of it (such as "its subject", "the gist in one sentence", "the risks it mentions") or an element of a described collection (such as "3", "the last", "the largest"). No preamble, no explanation, and do not restate the query.

      %
  # Set-notation sigil operators (bd-4e72c3) — terse DETERMINISTIC aliases for the
  # $union/$inter/$diff/$elem value builtins (bd-49d65a), delegating via builtin: like <$> / ↦ / ⊘.
  # Priority: ∩ (7) binds tighter than ∪/∖ (6) [mirrors × over +]; ∈ (5) sits with the
  # comparisons (Bool result), so `x ∈ a ∪ b` parses as `x ∈ (a ∪ b)`.
  setunion:
    op: "∪"
    description: |
      Set union: a ∪ b — order-preserving, deduped. Deterministic glyph alias for $union% (binary case). Dict operands operate on their keys.
    arity: 2
    fixity: infix
    priority: 6
    builtin: union
  setdiff:
    op: "∖"
    description: |
      Set difference: a ∖ b — items of a not present in b (deduped, a-order). Deterministic glyph alias for $diff%. (∖ is U+2216 SET MINUS.)
    arity: 2
    fixity: infix
    priority: 6
    builtin: diff
  setinter:
    op: "∩"
    description: |
      Set intersection: a ∩ b — items of a also present in b (deduped, a-order). Deterministic glyph alias for $inter%. Binds tighter than ∪/∖.
    arity: 2
    fixity: infix
    priority: 7
    builtin: inter
  setelem:
    op: "∈"
    description: |
      Membership: x ∈ coll — true if x is a list element, dict key, or string substring. Bool result. Deterministic glyph alias for $elem% (arg order: item ∈ collection).
    arity: 2
    fixity: infix
    priority: 5
    builtin: elem

  # Boolean-logic operators (bd-f1ee6f) — first-class logical AND/OR, DISTINCT from the
  # string compose-&/| (which weave "X and Y" text). Deterministic; operands coerced to
  # bool (truthy), result bool. ∧ (4) binds tighter than ∨ (3), both looser than the
  # comparisons (5), so `a==b ∧ c==d` = `(a==b) ∧ (c==d)`. Cleans up the mutual judge.
  booland:
    op: "∧"
    description: |
      Logical AND: a ∧ b — true iff BOTH operands are truthy. Bool result. First-class conjunction, distinct from compose-& (string weave). Evaluates both operands (use $if for short-circuit). Glyph alias for $and%.
    arity: 2
    fixity: infix
    priority: 4
    builtin: and
  boolor:
    op: "∨"
    description: |
      Logical OR: a ∨ b — true iff EITHER operand is truthy. Bool result. Distinct from compose-| (string choice). Glyph alias for $or%.
    arity: 2
    fixity: infix
    priority: 3
    builtin: or
  boolnot:
    op: "¬"
    description: |
      Logical NOT: ¬a — true iff a is falsy. Bool result, negating truthiness of any Bool (incl. fuzzy ~> results). The boolean twin of ! (which is TEXTUAL negation, "not X" prose); ¬ composes in fold-fusion count-if-NOT. Binds tighter than ∧∨. Glyph alias for $not%.
    arity: 1
    fixity: prefix
    priority: 14
    builtin: not
  sqrtop:
    op: "√"
    description: |
      Square root: √x — the non-negative square root of x as a Number (deterministic, prefix unary). Enables terse stddev (√variance), Pythagoras √(3*3+4*4)→5, Euclidean distance, geometric mean. Glyph alias for $sqrt%.
    arity: 1
    fixity: prefix
    priority: 14
    builtin: sqrt

tests:
  det-mtimes: { mode: det, expr: "xxx_2", expected: "xxxxxx" }
  det-mtimes-list: { mode: det, expr: "_sep=',';[a,b]_2", expected: "a,b,a,b" }
  det-not: { mode: det, expr: "!foo", expected: "not foo" }
  det-and: { mode: det, expr: "a&b&c", expected: "a and b and c" }
  det-or: { mode: det, expr: "a|b", expected: "a or b" }
  # comparison ops: == != <= >= — all deterministic, result: bool. `==` lexes as
  # one op via the lexer longest-match tweak (a lone `=` stays assignment).
  det-eq:       { mode: det, expr: "5 == 5", expected: "true" }
  det-eq-false: { mode: det, expr: "3 == 4", expected: "false" }
  det-ne:       { mode: det, expr: "3 != 4", expected: "true" }
  det-ne-false: { mode: det, expr: "4 != 4", expected: "false" }
  det-le:       { mode: det, expr: "3 <= 5", expected: "true" }
  det-le-false: { mode: det, expr: "5 <= 3", expected: "false" }
  det-booland:   { mode: det, expr: "(5==5)∧(3==3)", expected: "true" }
  det-booland-f: { mode: det, expr: "(5==5)∧(3==4)", expected: "false" }
