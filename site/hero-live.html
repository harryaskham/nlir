<section class="hero">
  <div>
    <h1>Shorthand in.<br><em>Prose</em> out.</h1>
    <p class="lede">A small language for the prompt window. Exact data operations and model-backed text operators share one evaluator, so a program can be part code and part judgement.</p>
    <div class="actions">
      <a class="btn primary" href="workspace/">Open the workspace</a>
      <a class="btn" href="spec-lab/">Spec lab</a>
      <a class="btn" href="spec.html">Read the spec</a>
    </div>
  </div>
  <div>
    <div class="console live">
      <div class="row">
        <input id="hx" spellcheck="false" autocomplete="off" aria-label="nlir expression">
        <button id="hstep" type="button" title="Show each reduction">Step</button>
        <button id="hgo" class="go" type="button" title="Evaluate (Enter)">Run ▸</button>
      </div>
      <div class="out" id="hout" aria-live="polite"><span class="ph">Loading the evaluator…</span></div>
      <div class="tabs" role="tablist" id="htabs"></div>
    </div>
    <div class="live-meta"><span id="hmeta">wasm · det mode · in your browser</span></div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script type="module">
  const $ = id => document.getElementById(id);
  const out = $('hout'), hx = $('hx'), meta = $('hmeta');
  const norm = v => (v instanceof Map ? Object.fromEntries(v) : v);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const EXAMPLES = [
    { tab: 'ops gate', expr: "?%({$0+$1}⊘({$contains%($0,'ERROR')}↦['ok','ERROR: oom','ok','ERROR: disk full'])>=2,'page on-call','all clear')" },
    { tab: 'data', expr: "orders=[{who=ada, total=12.5},{who=bo, total=40},{who=cy, total=7}]; $join%({$0.who}↦($filter%({$0.total>=10}, $orders)), ', ')" },
    { tab: 'spec → prose', expr: "rule={id='R 1.1', force='must not', act='approve a change without evidence of tests'}; 'Rule ' ++ $rule.id ++ ': reviewers ' ++ $rule.force ++ ' ' ++ $rule.act ++ '.'" },
    { tab: 'arithmetic', expr: "$fold%({$0+$1}, 1..100)" },
    { tab: 'formal', expr: "@'lmk if any Qs'", captured: 'Please let me know if you have any questions.', model: 'model · captured' },
  ];
  let evaluate, stepFn, cfgJson = '{}', ready = false, current = EXAMPLES[0];
  const tabs = $('htabs');
  EXAMPLES.forEach((ex, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab'; b.textContent = ex.tab;
    b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    b.onclick = () => { [...tabs.children].forEach(t => t.setAttribute('aria-selected', 'false')); b.setAttribute('aria-selected', 'true'); current = ex; hx.value = ex.expr; run(); };
    tabs.appendChild(b);
  });
  hx.value = current.expr;
  try {
    const m = await import('./workspace/pkg/nlir_wasm.js');
    if (m.default) await m.default();
    evaluate = m.evaluate; stepFn = m.step; ready = true;
    try {
      const y = m.defaultConfigYaml ? m.defaultConfigYaml() : await (await fetch('workspace/config.example.yaml')).text();
      cfgJson = JSON.stringify(window.jsyaml.load(y));
    } catch (_) { /* config-free evaluator still runs the keystone examples */ }
    try { const v = norm(m.version()); const ver = v && (v.crate || v.version); if (ver) meta.textContent = `nlir ${ver} · wasm · det mode · in your browser`; } catch (_) {}
  } catch (e) {
    out.innerHTML = '<span class="err">The evaluator did not load. <a href="workspace/">Open the workspace</a></span>';
  }
  const prose = (txt, tag) => `<div class="prose-out"><span class="arrow">→</span><span>${esc(txt).replace(/\n/g, '<br>')}</span></div>` + (tag ? `<div class="live-meta">${tag}</div>` : '');
  async function run() {
    if (current.captured && hx.value === current.expr) { out.innerHTML = prose(current.captured, current.model); return; }
    if (!ready) return;
    try {
      const r = norm(await evaluate(hx.value, cfgJson, '{}', 'det', {}));
      out.innerHTML = r.ok ? prose(r.result) : `<span class="err">${esc(r.error)}</span>`;
    } catch (e) { out.innerHTML = `<span class="err">${esc(e)}</span>`; }
  }
  async function step() {
    if (!ready) return;
    try {
      const r = norm(await stepFn(hx.value, cfgJson, '{}', 'det', {}));
      const steps = (r.steps || []).map(norm);
      out.innerHTML = r.ok ? steps.map(s => `<div class="step">${esc(s.expr)}</div>`).join('') : `<span class="err">${esc(r.error)}</span>`;
    } catch (e) { out.innerHTML = `<span class="err">${esc(e)}</span>`; }
  }
  $('hgo').onclick = run; $('hstep').onclick = step;
  hx.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  run();
</script>
