name: CI

# fmt · clippy · build · SPEC operator sync · config tests · examples · tests, inside the
# flake's dev shell on the self-hosted nix runners.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The harryaskham/* crates are public but their Cargo manifests name ssh:// URLs and
  # the runners have no SSH key: fetch them over HTTPS. Per-process git config, so the
  # persistent runner's global git config is never modified.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: fmt · clippy · test · examples · spec ops
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check
        run: |
          nix develop --command bash -euo pipefail -c '
            export CARGO_TARGET_DIR="$HOME/.cache/nlir-ci/target"
            cargo fmt --all --check
            cargo clippy --all-targets -- -D warnings
            cargo build --release
            "$CARGO_TARGET_DIR/release/nlir" --config config.example.yaml test
            NLIR="$CARGO_TARGET_DIR/release/nlir" bash examples/structure.sh
            NLIR="$CARGO_TARGET_DIR/release/nlir" bash examples/lens.sh
            python3 scripts/verify-spec-ops.py
            python3 scripts/verify-spec-lab.py
            cargo test --all
          '
